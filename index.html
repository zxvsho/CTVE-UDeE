    <!-- Global Vite HMR & WebSocket shield for iframe environments -->
    <script>
      (function() {
        try {
          var OrigWebSocket = window.WebSocket;
          if (OrigWebSocket) {
            window.WebSocket = function(url, protocols) {
              var sUrl = String(url || '');
              if (protocols === 'vite-hmr' || sUrl.indexOf('token=') !== -1 || sUrl.indexOf('24678') !== -1 || sUrl.indexOf('5173') !== -1) {
                var listeners = {};
                var fakeSocket = {
                  readyState: 1, // OPEN
                  send: function() {},
                  close: function() {},
                  addEventListener: function(event, fn) {
                    listeners[event] = listeners[event] || [];
                    listeners[event].push(fn);
                  },
                  removeEventListener: function(event, fn) {
                    if (listeners[event]) {
                      listeners[event] = listeners[event].filter(function(cb) { return cb !== fn; });
                    }
                  },
                  dispatchEvent: function() { return false; },
                  onopen: null,
                  onmessage: null,
                  onerror: null,
                  onclose: null
                };
                setTimeout(function() {
                  if (fakeSocket.onopen) fakeSocket.onopen({ type: 'open' });
                  if (listeners['open']) {
                    listeners['open'].forEach(function(cb) { try { cb({ type: 'open' }); } catch(e) {} });
                  }
                }, 10);
                return fakeSocket;
              }
              return new OrigWebSocket(url, protocols);
            };
            window.WebSocket.prototype = OrigWebSocket.prototype;
          }
        } catch (e) {}

        // Global interception for WebSocket and module runner rejections
        window.addEventListener('unhandledrejection', function(event) {
          var reason = String(event && event.reason ? (event.reason.stack || event.reason.message || event.reason) : '');
          if (reason.indexOf('WebSocket') !== -1 || reason.indexOf('@vite/client') !== -1 || reason.indexOf('createWebSocketModuleRunnerTransport') !== -1) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        });

        window.addEventListener('error', function(event) {
          var msg = String((event && (event.message || event.filename)) || '');
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('@vite/client') !== -1 || msg.indexOf('createWebSocketModuleRunnerTransport') !== -1) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        });
      })();
    </script>
