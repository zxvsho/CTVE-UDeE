    <script>
      // Ignore harmless Vite HMR WebSocket connection errors in iframe sandbox
      window.addEventListener('unhandledrejection', function(event) {
        var reason = String(event && event.reason ? (event.reason.stack || event.reason) : '');
        if (reason.indexOf('WebSocket') !== -1 || reason.indexOf('@vite/client') !== -1 || reason.indexOf('createWebSocketModuleRunnerTransport') !== -1) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = String((event && (event.message || event.filename)) || '');
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('@vite/client') !== -1) {
          event.preventDefault();
        }
      });
    </script>
